aid: authorizenet
name: Authorize.net
description: >-
  Authorize.net is a payment gateway operated by Visa (Visa Acceptance Solutions)
  that lets merchants and platforms accept credit card and eCheck.Net payments online,
  in person, and through mobile apps. Its developer platform exposes a transaction
  API (the XML/JSON gateway at /xml/v1 and a REST surface at /rest/v1) for one-time and
  recurring payments, the Customer Information Manager (CIM) for stored payment profiles,
  Accept.js and Accept Hosted for tokenized/hosted card capture, Automated Recurring
  Billing (ARB), transaction reporting, fraud detection (Advanced Fraud Detection Suite),
  and webhooks for asynchronous event notifications. Official server SDKs ship for PHP,
  .NET, Java, Python, Node.js, and Ruby, plus Accept mobile SDKs for iOS and Android.
  Authentication uses merchant API Login ID + Transaction Key, with OAuth 2.0 available
  for partner/Accept integrations. Added to the API Evangelist network from an
  Insight Partners portfolio lead and enriched from Authorize.net's public developer
  surface.
